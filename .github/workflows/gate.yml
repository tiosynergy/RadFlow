# ============================================================
#  Гейт репозитория. Заведён в с50 (фаза 2 глубокого аудита).
#
#  Зачем. До с50 между красным тестом и продом стояла только дисциплина
#  агента. Замерено на чистом клоне, тремя мутациями:
#    - ошибка ТИПА          -> `npm run build` ПАДАЕТ  (типы деплой гейтят);
#    - красный ТЕСТ         -> `npm run build` ПРОХОДИТ (тесты НЕ гейтят);
#    - предупреждение ЛИНТА -> и сборка, и прежний `eslint .` возвращали 0
#      (поэтому в package.json добавлен `--max-warnings 0`).
#  Vercel деплоит из `main` командой `npm run build`, то есть без тестов.
#
#  ВАЖНО: сам по себе этот workflow НЕ блокирует ни мерж, ни деплой — он
#  только красит галочку. Чтобы он стал настоящим гейтом, в настройках
#  GitHub нужно включить branch protection на `main` с обязательной
#  проверкой `gate`. Это решение владельца, не агента.
#
#  Секреты не нужны, но с с59 (RF-05, пакет 39) пропуск гейта миграций
#  больше НЕ молчаливый: без ключей `migration-gate --build` падает, если
#  не сказано явно RADFLOW_GATE_NO_DB=1 — и тогда строка лога говорит
#  «БЕЗ ЗВІРКИ». На Vercel эта переменная запрещена (exit 1). Тесты базу
#  не трогают вообще. Чтобы CI звірял леджер по-настоящему — добавить
#  секреты NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY в GitHub
#  (RADFLOW_GATE_NO_DB при наличии ключей игнорируется — гейт бежит
#  по-настоящему; убрать переменную стоит ради честности лога) — решение
#  владельца.
# ============================================================
name: gate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # engines в package.json: ">=22 <25". На машине владельца стоит 24,
          # чистый замер с50 сделан на 22 — фиксируем 22, чтобы гейт проверял
          # нижнюю границу диапазона, а не только ту версию, что под рукой.
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # build ПОСЛЕДНИМ и обязательно: tsc и eslint не парсят CSS, сломанный
      # CSS-комментарий ловит только сборка (AGENTS.md, урок с16).
      - run: npm run build
        env:
          # CI без секретів: пропуск ЯВНИЙ, лог каже «БЕЗ ЗВІРКИ» (RF-05, с59).
          RADFLOW_GATE_NO_DB: "1"
